name: UI CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check linked calculation function
        run: deno check --node-modules-dir=auto supabase/functions/opencalcs-run-calculation-v2/index.ts

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
